<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supreme Leader Inbox</title>
    <style>
        :root {
            --bg-deep: #070d1b;
            --bg-card: #0f1c3f;
            --bg-input: #172a5c;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
        body { background: var(--bg-deep); color: var(--text-main); min-height: 100dvh; display: flex; justify-content: center; padding: 14px; }
        .inbox-shell { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
        .card { background: var(--bg-card); border: 1px solid #1e293b; border-radius: 16px; padding: 16px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn { background: linear-gradient(135deg, #3b82f6, #2563eb); color: #fff; border: none; padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-alert { background: #1e293b; border: 1px solid #334155; color: var(--success); }
        input { width: 100%; background: var(--bg-input); border: 1px solid #2563eb33; border-radius: 10px; padding: 12px 14px; color: var(--text-main); font-size: 15px; outline: none; }
        input:focus { border-color: var(--accent-blue); }

        .thread-list { display: flex; flex-direction: column; gap: 8px; max-height: 240px; overflow-y: auto; margin-top: 10px; }
        .thread-item { background: var(--bg-input); border: 1px solid transparent; border-radius: 12px; padding: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .thread-item.active { border-color: var(--accent-blue); background: #1e3570; }
        .thread-name { font-weight: 800; font-size: 14px; }
        .thread-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .thread-preview { font-size: 12px; color: #cbd5e1; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
        .unread-pill { background: var(--accent-red); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; }

        .messages-box { background: #070d1b; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; height: 270px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 12px 0; }
        .bubble { max-width: 82%; padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .bubble.user { align-self: flex-start; background: #1e293b; border-left: 3px solid var(--accent-blue); }
        .bubble.leader { align-self: flex-end; background: #dc2626; color: #fff; }
        .meta { font-size: 10px; opacity: 0.75; margin-top: 4px; }
        .reply-row { display: flex; gap: 8px; }
        .err { color: var(--danger); font-size: 12px; margin-top: 8px; display: none; }
    </style>
</head>
<body>
<div class="inbox-shell">
    <div class="card top-bar">
        <div>
            <h2 style="font-size: 18px;">🔺 Supreme Leader Inbox</h2>
            <p style="font-size: 11px; color: var(--text-muted);" id="workerStatusLabel">illuminati.illuminati-696.workers.dev</p>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-alert" onclick="enableAlerts()">🔔 Alerts</button>
            <button class="btn" onclick="loadInbox()">↻ Refresh</button>
        </div>
    </div>

    <!-- PIN Gate -->
    <div id="authCard" class="card">
        <h3 style="font-size: 15px; margin-bottom: 8px;">Enter Admin PIN</h3>
        <div class="reply-row">
            <input type="password" id="adminPinInput" placeholder="Enter your PIN" onkeydown="if(event.key==='Enter') unlockInbox()">
            <button class="btn" onclick="unlockInbox()">Unlock</button>
        </div>
        <p id="authError" class="err"></p>
    </div>

    <!-- Main Inbox & Chat -->
    <div id="mainPanel" style="display:none; flex-direction:column; gap:14px;">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3 style="font-size: 15px;">Users Who Messaged You (<span id="threadCount">0</span>)</h3>
            </div>
            <div id="threadList" class="thread-list">
                <p style="font-size:12px; color:var(--text-muted);">Loading conversations...</p>
            </div>
        </div>

        <div class="card">
            <div id="activeUserHeader" style="font-size:14px; font-weight:800; color:var(--text-muted);">Select a user above to chat</div>
            <div id="messagesBox" class="messages-box">
                <p style="font-size:13px; color:var(--text-muted); text-align:center; margin:auto;">No conversation selected.</p>
            </div>
            <div class="reply-row">
                <input type="text" id="replyInput" placeholder="Type your reply..." onkeydown="if(event.key==='Enter') sendReply()">
                <button class="btn btn-red" onclick="sendReply()">Reply</button>
            </div>
            <p id="replyError" class="err"></p>
        </div>
    </div>
</div>

<script>
    const WORKER_URL = "https://illuminati.illuminati-696.workers.dev";
    const PIN_STORAGE_KEY = "supreme_leader_pin_v1";

    let adminPin = "";
    let activeThreadId = null;
    let lastTotalUnread = 0;

    window.addEventListener("DOMContentLoaded", () => {
        const savedPin = sessionStorage.getItem(PIN_STORAGE_KEY);
        if (savedPin) {
            adminPin = savedPin;
            showMainPanel();
            loadInbox();
            setInterval(pollAll, 4000);
        }
    });

    function showMainPanel() {
        document.getElementById("authCard").style.display = "none";
        document.getElementById("mainPanel").style.display = "flex";
    }

    async function unlockInbox() {
        const pin = document.getElementById("adminPinInput").value.trim();
        const err = document.getElementById("authError");
        if (!pin) {
            err.innerText = "Please enter your PIN.";
            err.style.display = "block";
            return;
        }
        const res = await fetch(`${WORKER_URL}/inbox`, {
            headers: { "X-Admin-Pin": pin }
        });
        if (!res.ok) {
            err.innerText = "Wrong PIN.";
            err.style.display = "block";
            return;
        }
        err.style.display = "none";
        adminPin = pin;
        sessionStorage.setItem(PIN_STORAGE_KEY, pin);
        showMainPanel();
        await loadInbox();
        setInterval(pollAll, 4000);
    }

    function playChime() {
        try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioCtx();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.2);
        } catch (e) {}
    }

    function enableAlerts() {
        if (!("Notification" in window)) return;
        Notification.requestPermission().then(p => {
            if (p === "granted") {
                new Notification("Supreme Leader Alerts Enabled", { body: "You will be notified when users message you." });
            }
        });
    }

    async function pollAll() {
        await loadInbox();
        if (activeThreadId) {
            await loadThreadMessages(activeThreadId, false);
        }
    }

    async function loadInbox() {
        if (!adminPin) return;
        const res = await fetch(`${WORKER_URL}/inbox`, {
            headers: { "X-Admin-Pin": adminPin }
        });
        if (!res.ok) return;
        const data = await res.json();
        const threads = data.threads || [];
        document.getElementById("threadCount").innerText = String(threads.length);

        const totalUnread = threads.reduce((sum, t) => sum + (t.unread_for_leader || 0), 0);
        document.title = totalUnread > 0 ? `(${totalUnread}) Supreme Leader Inbox` : "Supreme Leader Inbox";

        if (totalUnread > lastTotalUnread) {
            playChime();
            if ("Notification" in window && Notification.permission === "granted") {
                const newest = threads[0];
                new Notification(`New message from ${newest ? newest.user_name : "User"}`, {
                    body: newest ? newest.last_message : "You have a new message."
                });
            }
        }
        lastTotalUnread = totalUnread;

        const listEl = document.getElementById("threadList");
        if (threads.length === 0) {
            listEl.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">No messages yet.</p>`;
            return;
        }

        listEl.innerHTML = threads.map(t => {
            const isActive = t.thread_id === activeThreadId;
            const unread = t.unread_for_leader || 0;
            const prio = Array.isArray(t.priorities) && t.priorities.length ? ` • ${t.priorities.join(", ")}` : "";
            return `
                <div class="thread-item ${isActive ? "active" : ""}" onclick="selectThread('${escapeAttr(t.thread_id)}')">
                    <div style="min-width:0;">
                        <div class="thread-name">${escapeHtml(t.user_name || "Guest")}</div>
                        <div class="thread-sub">${escapeHtml(t.country || "")} ${escapeHtml(t.phone || "")}${escapeHtml(prio)}</div>
                        <div class="thread-preview">${escapeHtml(t.last_message || "")}</div>
                    </div>
                    ${unread > 0 ? `<span class="unread-pill">${unread}</span>` : ""}
                </div>
            `;
        }).join("");
    }

    async function selectThread(threadId) {
        activeThreadId = threadId;
        await fetch(`${WORKER_URL}/read`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Admin-Pin": adminPin },
            body: JSON.stringify({ thread_id: threadId })
        });
        await loadInbox();
        await loadThreadMessages(threadId, true);
    }

    async function loadThreadMessages(threadId, updateHeader) {
        const res = await fetch(`${WORKER_URL}/messages?thread_id=${encodeURIComponent(threadId)}`);
        if (!res.ok) return;
        const data = await res.json();
        const msgs = data.messages || [];

        if (updateHeader && msgs.length > 0) {
            const firstUser = msgs.find(m => m.sender === "user") || msgs[0];
            document.getElementById("activeUserHeader").innerText =
                `Chatting with: ${firstUser.user_name || "Guest"} (${firstUser.country || ""} ${firstUser.phone || ""})`;
        }

        const box = document.getElementById("messagesBox");
        if (msgs.length === 0) {
            box.innerHTML = `<p style="font-size:13px; color:var(--text-muted); text-align:center; margin:auto;">No messages in this thread yet.</p>`;
            return;
        }

        box.innerHTML = msgs.map(m => {
            const isLeader = m.sender === "leader";
            const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
            return `
                <div class="bubble ${isLeader ? "leader" : "user"}">
                    <div>${escapeHtml(m.text || "")}</div>
                    <div class="meta">${isLeader ? "You (Supreme Leader)" : escapeHtml(m.user_name || "User")} ${time ? "• " + time : ""}</div>
                </div>
            `;
        }).join("");
        box.scrollTop = box.scrollHeight;
    }

    async function sendReply() {
        const input = document.getElementById("replyInput");
        const err = document.getElementById("replyError");
        const text = input.value.trim();

        if (!activeThreadId) {
            err.innerText = "Select a user thread first.";
            err.style.display = "block";
            return;
        }
        if (!text) return;
        err.style.display = "none";

        const res = await fetch(`${WORKER_URL}/reply`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Admin-Pin": adminPin },
            body: JSON.stringify({ thread_id: activeThreadId, text })
        });
        if (res.ok) {
            input.value = "";
            await loadThreadMessages(activeThreadId, false);
            await loadInbox();
        }
    }

    function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function escapeAttr(s) {
        return String(s).replace(/'/g, "\\'");
    }
</script>
</body>
</html>
