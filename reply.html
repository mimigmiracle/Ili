<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supreme Leader Reply Console</title>
    <style>
        :root {
            --bg-deep: #070d1b;
            --bg-card: #0f1c3f;
            --bg-panel: #13234d;
            --bg-input: #172a5c;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-subtle: #1e293b;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
        body {
            background: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        header h1 { font-size: 17px; font-weight: 800; }
        header span { font-size: 12px; color: var(--accent-green); font-weight: 700; }

        .btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); }

        .console-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 310px 1fr;
            min-height: 0;
        }

        .threads-sidebar {
            background: var(--bg-card);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .sidebar-top {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .thread-item {
            padding: 13px 14px;
            border-bottom: 1px solid rgba(30, 41, 59, 0.7);
            cursor: pointer;
            transition: background 0.15s;
        }
        .thread-item:hover { background: var(--bg-panel); }
        .thread-item.active {
            background: var(--bg-panel);
            border-left: 3px solid var(--accent-green);
        }
        .thread-user { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .thread-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }
        .thread-preview {
            font-size: 12px;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-workspace {
            display: flex;
            flex-direction: column;
            background: var(--bg-deep);
            min-height: 0;
        }
        .chat-topbar {
            padding: 12px 18px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-topbar h2 { font-size: 15px; }
        .chat-topbar p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .messages-feed {
            flex: 1;
            padding: 18px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
            word-break: break-word;
        }
        .msg-user {
            align-self: flex-start;
            background: var(--bg-panel);
            border-left: 3px solid var(--accent-blue);
        }
        .msg-leader {
            align-self: flex-end;
            background: #065f46;
            color: #ffffff;
        }
        .msg-time {
            font-size: 10px;
            opacity: 0.75;
            margin-top: 4px;
        }

        .reply-bar {
            padding: 12px 18px;
            background: var(--bg-card);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            gap: 10px;
        }
        .reply-bar input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid #2563eb44;
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 15px;
            outline: none;
        }
        .reply-bar input:focus { border-color: var(--accent-green); }

        .empty-state {
            margin: auto;
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 24px;
        }

        @media (max-width: 720px) {
            .console-layout { grid-template-columns: 1fr; grid-template-rows: 210px 1fr; }
            .threads-sidebar { border-right: none; border-bottom: 1px solid var(--border-subtle); }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>🔺 Supreme Leader Chat Console</h1>
        <span id="statusLabel">● Live Sync Ready (No Password)</span>
    </div>
    <button type="button" class="btn btn-blue" onclick="loadAllChats()">↻ Refresh</button>
</header>

<div class="console-layout">
    <aside class="threads-sidebar">
        <div class="sidebar-top">
            <span>All User Chats</span>
            <span id="threadCountBadge">0</span>
        </div>
        <div id="threadsList">
            <div class="empty-state">Loading chats...</div>
        </div>
    </aside>

    <main class="chat-workspace">
        <div class="chat-topbar">
            <div>
                <h2 id="selectedUserTitle">Select a chat thread</h2>
                <p id="selectedThreadMeta">All messages load automatically on open</p>
            </div>
        </div>

        <div id="messagesFeed" class="messages-feed">
            <div class="empty-state">Waiting for chats...</div>
        </div>

        <div class="reply-bar">
            <input type="text" id="replyInput" placeholder="Type your reply..." onkeydown="if(event.key==='Enter') sendReply()">
            <button type="button" class="btn" onclick="sendReply()">Send Reply</button>
        </div>
    </main>
</div>

<script>
    const WORKER_URL = "https://illuminati.illuminati-696.workers.dev";
    const CACHE_KEY = "leader_console_threads_cache_v1";

    let threadsMap = {};
    let activeThreadId = null;

    window.addEventListener("DOMContentLoaded", () => {
        try {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}");
            if (cached && typeof cached === "object") {
                threadsMap = cached;
                const keys = Object.keys(threadsMap);
                if (keys.length > 0 && !activeThreadId) {
                    activeThreadId = keys[0];
                }
                renderThreadsList();
                renderActiveThread();
            }
        } catch (e) {}

        loadAllChats();
        setInterval(loadAllChats, 3500);
    });

    async function loadAllChats() {
        const statusEl = document.getElementById("statusLabel");
        try {
            const res = await fetch(`${WORKER_URL}/threads`);
            if (res.ok) {
                const data = await res.json();
                if (Array.isArray(data.threads)) {
                    const nextMap = {};
                    data.threads.forEach(t => {
                        const tid = t.thread_id || t.id;
                        if (!tid) return;
                        nextMap[tid] = {
                            thread_id: tid,
                            user_name: t.user_name || "Guest",
                            country: t.country || "",
                            phone: t.phone || "",
                            priorities: t.priorities || [],
                            messages: Array.isArray(t.messages) ? t.messages : []
                        };
                    });
                    threadsMap = nextMap;
                    localStorage.setItem(CACHE_KEY, JSON.stringify(threadsMap));
                } else if (Array.isArray(data.messages)) {
                    groupFlatMessages(data.messages);
                }
                statusEl.innerText = "● Live Synced";
            } else {
                const fallbackRes = await fetch(`${WORKER_URL}/messages`);
                if (fallbackRes.ok) {
                    const fallbackData = await fallbackRes.json();
                    if (Array.isArray(fallbackData.messages)) {
                        groupFlatMessages(fallbackData.messages);
                    }
                }
                statusEl.innerText = "● Live Synced";
            }
        } catch (err) {
            statusEl.innerText = "● Showing Cached Chats";
        }

        const keys = Object.keys(threadsMap);
        if (!activeThreadId && keys.length > 0) {
            activeThreadId = keys[0];
        }
        renderThreadsList();
        renderActiveThread();
    }

    function groupFlatMessages(messages) {
        const grouped = {};
        messages.forEach(m => {
            const tid = m.thread_id || "default_thread";
            if (!grouped[tid]) {
                grouped[tid] = {
                    thread_id: tid,
                    user_name: m.user_name || "Guest",
                    country: m.country || "",
                    phone: m.phone || "",
                    priorities: m.priorities || [],
                    messages: []
                };
            }
            if (m.user_name) grouped[tid].user_name = m.user_name;
            if (m.country) grouped[tid].country = m.country;
            if (m.phone) grouped[tid].phone = m.phone;
            grouped[tid].messages.push(m);
        });
        threadsMap = grouped;
        localStorage.setItem(CACHE_KEY, JSON.stringify(threadsMap));
    }

    function renderThreadsList() {
        const listEl = document.getElementById("threadsList");
        const badgeEl = document.getElementById("threadCountBadge");
        const threadArr = Object.values(threadsMap).sort((a, b) => {
            const lastA = a.messages && a.messages.length ? (a.messages[a.messages.length - 1].timestamp || 0) : 0;
            const lastB = b.messages && b.messages.length ? (b.messages[b.messages.length - 1].timestamp || 0) : 0;
            return lastB - lastA;
        });

        badgeEl.innerText = String(threadArr.length);

        if (threadArr.length === 0) {
            listEl.innerHTML = `<div class="empty-state">No chats found yet.</div>`;
            return;
        }

        listEl.innerHTML = threadArr.map(t => {
            const lastMsg = t.messages && t.messages.length ? t.messages[t.messages.length - 1].text : "No messages";
            const isActive = t.thread_id === activeThreadId ? "active" : "";
            return `
                <div class="thread-item ${isActive}" onclick="selectThread('${escapeAttr(t.thread_id)}')">
                    <div class="thread-user">${escapeHtml(t.user_name || "Guest")}</div>
                    <div class="thread-meta">${escapeHtml(t.country || "")} ${t.phone ? "• " + escapeHtml(t.phone) : ""}</div>
                    <div class="thread-preview">${escapeHtml(lastMsg || "")}</div>
                </div>
            `;
        }).join("");
    }

    function selectThread(tid) {
        activeThreadId = tid;
        renderThreadsList();
        renderActiveThread();
    }

    function renderActiveThread() {
        const titleEl = document.getElementById("selectedUserTitle");
        const metaEl = document.getElementById("selectedThreadMeta");
        const feedEl = document.getElementById("messagesFeed");

        const thread = activeThreadId ? threadsMap[activeThreadId] : null;
        if (!thread) {
            titleEl.innerText = "All Chats";
            metaEl.innerText = "No active thread selected";
            feedEl.innerHTML = `<div class="empty-state">No chat messages to display yet.</div>`;
            return;
        }

        titleEl.innerText = thread.user_name || "Guest";
        const prioText = Array.isArray(thread.priorities) && thread.priorities.length
            ? " • Wants: " + thread.priorities.join(", ")
            : "";
        metaEl.innerText = `${thread.country || "Unknown"} ${thread.phone ? "• " + thread.phone : ""}${prioText} (${thread.thread_id})`;

        const msgs = Array.isArray(thread.messages) ? thread.messages : [];
        if (msgs.length === 0) {
            feedEl.innerHTML = `<div class="empty-state">No messages in this thread yet.</div>`;
            return;
        }

        feedEl.innerHTML = msgs.map(m => {
            const isLeader = m.sender === "leader";
            const timeStr = m.timestamp
                ? new Date(m.timestamp).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
                : "";
            return `
                <div class="msg-bubble ${isLeader ? "msg-leader" : "msg-user"}">
                    <div>${escapeHtml(m.text || "")}</div>
                    <div class="msg-time">${isLeader ? "Supreme Leader" : escapeHtml(thread.user_name || "User")} ${timeStr ? "• " + timeStr : ""}</div>
                </div>
            `;
        }).join("");

        feedEl.scrollTop = feedEl.scrollHeight;
    }

    async function sendReply() {
        const input = document.getElementById("replyInput");
        const text = input.value.trim();
        if (!text || !activeThreadId) return;

        const payload = {
            thread_id: activeThreadId,
            sender: "leader",
            text: text,
            timestamp: Date.now()
        };

        if (!threadsMap[activeThreadId]) {
            threadsMap[activeThreadId] = { thread_id: activeThreadId, messages: [] };
        }
        threadsMap[activeThreadId].messages.push(payload);
        localStorage.setItem(CACHE_KEY, JSON.stringify(threadsMap));
        renderActiveThread();
        renderThreadsList();
        input.value = "";

        try {
            await fetch(`${WORKER_URL}/send`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            await loadAllChats();
        } catch (e) {}
    }

    function escapeHtml(str) {
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
        return String(str).replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }
</script>

</body>
</html>
